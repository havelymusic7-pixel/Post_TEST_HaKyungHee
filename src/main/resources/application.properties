spring.application.name=Post_TEST

# MySQL (board DB is created automatically if it does not exist)
spring.datasource.url=jdbc:mysql://localhost:3306/board?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# create the post table from schema.sql
spring.sql.init.mode=always

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.post.dto
mybatis.configuration.map-underscore-to-camel-case=true
