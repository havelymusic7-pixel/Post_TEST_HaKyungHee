<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
</head>
<body>
<h1>게시글 수정</h1>
<form th:action="@{/Post/update}" method="post">
    <input type="hidden" name="postNo" th:value="${post.postNo}">
    <p>번호 <span th:text="${post.postNo}"></span></p>
    <p>제목 <input type="text" name="title" size="60" th:value="${post.title}" required></p>
    <p>작성자 <input type="text" name="writer" th:value="${post.writer}" required></p>
    <p>내용<br><textarea name="content" rows="10" cols="70" th:text="${post.content}"></textarea></p>

    <button type="submit">수정</button>
    <button type="submit" th:formaction="@{/Post/delete}" formmethod="post"
            onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
    <a th:href="@{/Post/list}"><button type="button">목록</button></a>
</form>
</body>
</html>
